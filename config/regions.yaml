# Regions the tracker covers. Set enabled: false to drop one from the AI prompt and the brief.
regions:
  - {name: Black Sea, enabled: true}
  - {name: Sea of Azov, enabled: true}
  - {name: Strait of Hormuz, enabled: true}
  - {name: Persian Gulf, enabled: true}
  - {name: Gulf of Oman, enabled: true}
  - {name: Red Sea, enabled: true}
  - {name: Gulf of Aden, enabled: true}

# Warships are out of scope by default; set true to include them.
include_naval: false

# NASA FIRMS satellite fire detection.
# Polygons are [lon, lat] and deliberately rough: a fire inside one is only a lead for
# verification, never published on its own.
firms:
  bbox:  # west, south, east, north
    black_sea: [27.3, 40.8, 42.0, 47.5]
    hormuz: [54.0, 23.0, 60.5, 27.5]
