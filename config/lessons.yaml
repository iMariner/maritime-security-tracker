# Lessons learned: short rules every brief is written and checked against.
# Hermes adds lessons during the daily editor check ("lesson:" lines) and rewrites this list in its weekly
# learning review (at most 25 per section). Keep each rule one concrete sentence.
writing:
- Credit a ship's name only to the outlet, firm or database that gave it, never to UKMTO or a minister who did not name her, and keep the sinking or missing detail in the headline and lede.
- Name the vessel in the headline, standfirst, lede, key points, paragraph and tweet whenever the facts hold her name, and give the record's own date even when its summary carries neither.
- Attribute every figure, name and claim to the outlet or body that gave it, and credit each outlet only for what its own page reports.
- Give every borrowed casualty figure, flag or damage detail the ship and date its own source names, and keep another tracked vessel's figures out of this incident.
- 'Never lead with an attack reported on an earlier day: the headline and lede go to the most serious attack of the last 24 hours, and older strikes get their own dates in the text.'
- 'Repeat an older lead only when no later brief went public: check the earlier posts'' status before calling a two-day-old lead day-late.'
- Attach a government reaction only to the vessel its own statement names, and only for what that statement says.
- When official sources disagree on a date or detail, give each source and what it says rather than one version as settled.
- Put every attack still in the day's facts into the text, older ones in an Earlier in the week line with their own dates, and never call a region quiet when it holds one.
- Never repeat a sentence or figure between the headline, standfirst, key points and lede; each later section must add to the lede.
- What crews should know carries only what the data supports, with no statistics and no invented advice; context counts come only from tracker_context, credited to the iMariners tracker.
- Write a one-sided statement as a claim, naming the body that made it, and never add a cause or effect, such as a mine or an explosion, that its source does not state.
- 'Never write a hit, a sinking or a cause for a vessel reported on fire or disabled with the cause unknown: say what the report says and who gave it.'
- When a record is confirmed, name the body that confirmed it, and never write that no attribution details were given.
- 'Never attach a claim made about an unnamed vessel to a named ship: give such a claim in its own sentence with the date and the body that made it.'
- 'Never give a ship a type her record does not hold: check a ship database or the owner before the text calls a tug, a bulker or a boxship a tanker.'
- 'Keep the headline and lede to one story: never join a confirmed attack to a one-sided claim or to a second incident with the word as or while.'
- Write a correction for readers in plain words, with ships and dates, and keep internal incident numbers out of the article.
- 'A repatriation, towage, repair transit or scrapping voyage of a ship attacked earlier is not an attack of the day: give it the attack''s own date or leave it out.'
- 'Keep the headline at 80 characters or fewer so the code''s hard 90-character cut cannot break a word, and start every sentence with a capital letter: uKMTO and jMIC are wrong.'
facts:
- 'A report that gives no date, or an unnamed report of a ship sunk, is often an older attack reported again: match the outlet''s own date and vessel before treating it as new.'
- 'Read the year and month in an aggregator page''s URL and the date in its text: EnergyNow and Google News re-serve months-old strikes, and an oil price reaction is not an incident.'
- 'The same strike often arrives as several unnamed records: merge each copy into the record that names the ship, and never count one ship twice.'
- 'A ship on fire in one sea is not a ship disabled in another: merge two unnamed reports only when a source places the same ship in the same waters.'
- A record can absorb a different incident through its source list, so give each detail the date, distance and time its own source reports, and read today's ministry post rather than yesterday's.
- 'A grounding, collision, towage, repair transit, scrapping voyage or later sinking of a ship damaged in an earlier strike is not a new attack: reject it or merge it into that ship''s record.'
- 'Record a ship''s name, flag, IMO and type as a ship database or flag state gives them: the flag is her registry, not the owner''s country, and the map legend prints the type.'
- 'An official list can misspell a hull name or carry the same ship twice: check it against a ship database, and check her earlier record before rejecting a new entry as a duplicate.'
- 'A casualty figure, flag or damage detail can drift from another tracked ship, or sit on a headline about another vessel: check which ship each source names and drop unsourced figures.'
- Mark an incident confirmed only when a named body (UKMTO, JMIC, IMO, a coast guard, the owner or the flag state) confirms it, never by default and never on a headline's say-so.
- A one-sided claim stays claimed unless a neutral source or AIS corroborates it; shipping media citing unnamed authorities is not neutral.
- When two official sources give the same incident different dates, treat the disagreement as unresolved and say so; do not pick one silently.
- 'A round-up, analysis, commentary post, recap, denial or rebuttal that reports no new attack on a named ship is not an incident: reject it or merge it into the record it answers.'
- Set each incident's position and region from the place its own report gives, not the shared fallback (43.4, 34.5; 26.55, 56.35).
- 'A strike on a warship or naval supply vessel, a yacht, a small boat or a fishing vessel is not a merchant ship incident: give it no record.'
- 'A government or embassy statement about a named ship belongs to that ship''s record: check which vessel it names before merging it into an attack.'
- 'A fuel tanker or bowser struck on the front line is a land vehicle, not a merchant ship: record a tanker only when a source places the ship at sea.'
- 'A name or date fixed by yesterday''s editor check can be reset by a later collection run: re-check each record''s name, type and date in the tracker data every morning.'
- Read UKMTO's own update before pairing a fire with a claim, and give a named ship the place her own naming source gives, not an unnamed warning's position.
- 'A headline that carries a ship''s name does not prove the name belongs to this event: read the source''s own text before accepting a name, type or position.'
