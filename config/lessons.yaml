# Lessons learned: short rules every brief is written and checked against.
# Hermes adds lessons during the daily editor check ("lesson:" lines) and rewrites this list in its weekly
# learning review (at most 25 per section). Keep each rule one concrete sentence.
writing:
- Never attribute a ship name to UKMTO unless UKMTO's own warning names it; credit the outlet, firm or ship database that named the vessel.
- Name the vessel in the headline, standfirst, lede, key point and tweet whenever the facts hold its name, in normal capitalisation, and credit the name to its source.
- Attribute every figure, name and claim to the outlet or body that gave it, and credit each outlet only for what its own page reports.
- Give every borrowed casualty figure, flag or damage detail the ship and date its own source names, and keep another tracked vessel's figures out of this incident.
- 'Never lead with an attack reported on an earlier day: the headline and lede go to the most serious attack of the last 24 hours, and older strikes get their own dates in the text.'
- 'Repeat an older lead only when no later brief went public: check the earlier posts'' status before calling a two-day-old lead day-late.'
- Attach a government reaction only to the vessel its own statement names, and only for what that statement says.
- When official sources disagree on a date or detail, give each source and what it says rather than one version as settled.
- Put every attack still in the day's facts into the text, older ones in an Earlier in the week line with their own dates, and never call a region quiet when it holds one.
- Never repeat a sentence or figure between the headline, standfirst, key points and lede; each later section must add to the lede.
- Context counts come only from tracker_context and are credited to the iMariners tracker; keep counts and statistics out of What crews should know.
- 'What crews should know carries only what the data supports: report to UKMTO and follow UKMTO, JMIC and company instructions, with no invented advice.'
- Write a one-sided statement as a claim, naming the body that made it, never as a fact.
- Write a correction for readers in plain words, with ships and dates, and keep internal incident numbers out of the article.
- Never start a sentence with a warning number such as UKMTO warning 150-26.
- 'A repatriation, towage, repair, aid payment or family appeal about a ship attacked earlier is not an attack of the day: give it the attack''s own date or leave it out.'
- 'Keep the headline and lede to one story: never join a confirmed attack to a one-sided claim or to a second incident with the word as or while.'
- Credit a ship's name to whoever gave it, never to a minister or authority that reported the attack without naming the ship, and keep the sinking or missing detail in the headline and lede.
- Never write that a wire service could not verify a claim unless the cited page says so; every sentence must rest on a source in the record.
- When a record is confirmed, the text must name the body that confirmed it instead of saying no attribution details were given.
- 'Never attach a claim made about an unnamed vessel to a named ship: give such a claim in its own sentence with the date and the body that made it.'
- 'Never give a ship a type her record does not hold: check a ship database or the owner before the text calls a tug, a bulker or a boxship a tanker.'
facts:
- 'Take the event date from inside the source, never the date the page or warning was published: a warning''s own Incident Date beats its issue date.'
- A report that gives no date, especially a Black Sea one, is often an older attack reported again; check the outlet's own date and vessel before treating it as new.
- 'Read the year and month in an aggregator page''s URL and the date in its text: Google News and EnergyNow re-serve months-old items as fresh news.'
- 'The same strike often arrives as several unnamed records: merge each copy into the record that names the ship, treat same-day reports in the same waters as one attack, never count one ship twice.'
- 'A record can absorb a different incident through its source list, and a rejected record can come back as a new entry: check its date, place and status against its sources.'
- 'A record can join a fresh claim to an older strike''s follow-up: give each detail the date its own source reports.'
- A ship's flag is its state of registry, not the owner's country; record the flag a flag state or ship database gives even when media say otherwise.
- Record a ship name, flag, IMO or vessel type only as a source states it for this exact incident, and leave it blank rather than guess.
- 'Set the vessel type the same source gives with the name: the map legend prints it, so a chemical tanker logged as general cargo is a visible error.'
- 'A casualty figure, flag or damage detail can drift from another tracked ship into this record: check which vessel each source names before using its detail.'
- Mark an incident confirmed only when a named body (UKMTO, JMIC, IMO, a coast guard, the owner or the flag state) confirms it, never by default.
- A one-sided claim stays claimed unless a neutral source or AIS corroborates it; shipping media citing unnamed authorities is not neutral, only a named body, the owner or the flag state is.
- When two official sources give the same incident different dates, treat the disagreement as unresolved and say so; do not pick one silently.
- 'A round-up, analysis or recap that names no ship, flag or position, or repeats attacks already tracked, is not an incident: reject it rather than merge it.'
- Set each incident's position and region from the place its own report gives, not the shared fallback (43.4, 34.5; 26.55, 56.35).
- 'A grounding or collision in bad weather of a tanker already damaged in an earlier strike is not a new attack: reject it or merge it into that ship''s record.'
- 'A flag state''s denial or an owner''s rebuttal is not an attack: merge it into the record of the claim it denies instead of briefing it.'
- 'A casualty figure with no source of its own is not usable: check the flag state''s or the manager''s statement before injuries, missing crew or deaths reach the headline.'
- 'A strike on a warship or naval supply vessel is not an attack on a merchant ship: give it no incident record, however spectacular the report.'
- 'A government or embassy statement about a named ship belongs to that ship''s record: check which vessel it names before merging it into an attack.'
- 'An unnamed report of a ship sunk can be months old: the 17 October Red Sea item repeated the 4 August sinking of MSV Faize Noore Oliya, so open the page and match its date and ship before briefing it.'
- 'A named ship can be attacked twice: the IMO list carries the same vessel under separate dates, so check her earlier record before rejecting a new entry as a duplicate.'
- 'A threat to attack a ship, or a headline about concern over attacks, names no vessel and no strike: reject it rather than briefing it as an incident.'
- 'A report about an unidentified yacht, small boat or fishing vessel is not a merchant ship incident: record it only once a merchant vessel is named.'
