# Lessons learned: short rules every brief is written and checked against.
# Hermes adds lessons during the daily editor check ("lesson:" lines) and rewrites this list in its weekly
# learning review (at most 25 per section). Keep each rule one concrete sentence.
writing:
- Never attribute a ship name to UKMTO unless UKMTO's own warning names it; credit the outlet, firm or ship database that named the vessel.
- Name the vessel in the headline, standfirst, lede, key point and tweet whenever the facts hold its name, in normal capitalisation, and credit the name to its source.
- Attribute every figure, name and claim to the outlet or body that gave it, never to a report or shipping sources alone, and credit each outlet only for what its own page reports.
- Give every borrowed casualty figure, flag or damage detail the ship and date its own source names, and keep another tracked vessel's figures out of this incident.
- 'Never lead the brief with an attack reported on an earlier day: the headline and lede go to the most serious attack of the last 24 hours, and older strikes are background with their own dates.'
- Attach a government reaction only to the vessel its own statement names and only for what that statement says.
- When official sources disagree on a date or detail, give each source and what it says rather than one version as settled.
- Put each attack still in the day's facts into the text, older ones in an Earlier in the week line with their own dates, and never leave a region heading with no incident under it.
- Never say a region is quiet or that no new attacks were reported there when the day's facts hold an incident in it.
- Never repeat a sentence or figure between the headline, standfirst, key points and lede; each later section must add to the lede.
- Context counts come only from tracker_context and are credited to the iMariners tracker; keep counts and statistics out of What crews should know.
- 'What crews should know carries only what the data supports: report to UKMTO and follow UKMTO, JMIC and company instructions, with no invented advice.'
- Write a one-sided statement as a claim, naming the body that made it (Russia's defence ministry claimed it struck), never as a fact.
- Write a correction for readers in plain words, with ships and dates, and keep internal incident numbers out of the article.
- Never start a sentence with a warning number such as UKMTO warning 150-26, dated.
- 'A repatriation or aftermath report about a ship attacked earlier is not an attack of the day: give it the attack''s own date or leave it out.'
- 'Keep the headline and lede to one story: never join a confirmed attack to a one-sided claim or to a second incident with the word as or while.'
- Credit a ship's name to the outlet or firm that gave it, never to a minister or authority that reported the attack without naming the ship.
facts:
- 'Take the event date from inside the source, never the date the page or warning was published: a time-late UKMTO report of a 6 October strike arrived as an 8 October record.'
- A report that gives no date, especially a Black Sea one, is often an older attack reported again; check the outlet's own date and vessel before treating it as new.
- 'Read the year and month in an aggregator page''s URL and the date in its text: Google News and EnergyNow re-serve months-old items as fresh news.'
- 'The same strike often arrives as several unnamed records: merge each copy into the best sourced record for that ship and date, and never count one ship twice in a context tally.'
- Two incidents on the same day in the same or neighbouring waters, including blasts near a tanker after a UKMTO warning nearby, are one attack if the details match; merge the thinner record.
- 'A record can absorb a different incident through its source list, and a rejected record can come back as a new entry: check the record''s date, place and status against its own sources.'
- 'A record can join a fresh claim to an older strike''s follow-up: give each detail the date its own source reports, so a September casualty cannot make the record today''s lead.'
- A ship's flag is its state of registry, not the owner's country; record the flag a flag state, ARSVOM or a ship database gives even when media say otherwise.
- Record a ship name, flag, IMO or vessel type only as a source states it for this exact incident, and leave it blank rather than guess.
- 'A casualty figure, flag or damage detail can drift from another tracked ship into this record: check which vessel each source names before using its detail.'
- Mark an incident confirmed only when a source itself confirms the event (UKMTO, JMIC, IMO, a coast guard, the owner, the flag state or CENTCOM); a fresh record is never confirmed by default.
- When two official sources give the same incident different dates, treat the disagreement as unresolved and say so; do not pick one silently.
- A one-sided claim (Russia's defence ministry, Iran's PGSA, a single foreign outlet) stays claimed unless a neutral source or AIS corroborates the attack.
- Maritime authority or shipping sources is not a neutral confirmation; only a named authority such as UKMTO, JMIC, the owner or the flag state is.
- A report that names no ship, flag or position is a statistic or a repeat of attacks already tracked, not a new incident.
- Set each incident's position and region from the place its own report gives, not the shared fallback (43.4, 34.5 in the Black Sea, 26.55, 56.35 in Hormuz).
- 'A day''s copies can belong to two different attacks, so check every copy''s casualties and place against the record it was folded into: a strike that hurt nobody must not swallow a drone strike with
  two seafarers missing.'
- 'A flag state''s denial or an owner''s rebuttal is not an attack on a merchant ship: merge it into the record of the claim it denies instead of briefing it as an incident of the day.'
- An oil spill, high alert or environmental follow-up about a tanker is the aftermath of an attack already tracked, so find the tanker's own record and date before recording a new strike.
- 'A casualty figure with no source of its own is not usable: check the flag state''s or the manager''s statement before injuries, missing crew or deaths reach the headline.'
- 'A strike on a warship or naval supply vessel is not an attack on a merchant ship: give it no incident record, even when it is reported as a spectacular Black Sea strike.'
- 'A government or embassy statement about a named ship belongs to that ship''s record: check which vessel the statement names before merging it into an attack.'
