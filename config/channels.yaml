  - {handle: razvozhaev, name: "Sevastopol governor (Razvozhaev)", side: ru, kind: official}
  - {handle: tass_agency, name: "TASS", side: ru, kind: media}
  - {handle: rian_ru, name: "RIA Novosti", side: ru, kind: media}
  - {handle: kubanoperativ, name: "Kuban Operativny", side: ru, kind: local}
  - {handle: tuapse_news, name: "Tuapse News", side: ru, kind: local}
  - {handle: shot_shot, name: "SHOT", side: ru, kind: media}
  - {handle: mash, name: "Mash", side: ru, kind: media}
  - {handle: rybar, name: "Rybar", side: ru, kind: osint}
  - {handle: dva_majors, name: "Dva Mayora", side: ru, kind: osint}

