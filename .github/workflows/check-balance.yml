name: Check DeepSeek balance

# Manual check. The daily Telegram message also shows the balance and warns below LOW_BALANCE_USD.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python -c "from tracker import llm; print(llm.balance_line(llm.balance_usd()) or 'balance unknown')"
