name: Collect and process

on:
  schedule:
    # hourly, off the hour, except 04:00-05:59 UTC when the morning brief collects and writes itself
    - cron: "37 0-3,6-23 * * *"
  workflow_dispatch:

permissions:
  contents: write   # commit data/
  issues: write     # open verification issues
  models: read      # GitHub Models fallback

concurrency:
  group: collect          # its own queue: a collection run can never cancel a waiting brief
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Apply pending verdicts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIERS: ${{ vars.VERIFIERS }}
        run: python -m tracker.apply_verdict
      - name: Collect, extract, match
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL_FAST: ${{ vars.LLM_MODEL_FAST }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_LLM_ITEMS_PER_RUN: ${{ vars.MAX_LLM_ITEMS_PER_RUN }}
          EXTRACT_BATCH_SIZE: ${{ vars.EXTRACT_BATCH_SIZE }}
          LLM_MIN_ITEMS: ${{ vars.LLM_MIN_ITEMS }}
        run: python -m tracker.run_pipeline
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          # If the brief or a verdict wrote data meanwhile, keep theirs and drop this run's update:
          # the next hourly run collects again, so nothing is lost for good.
          if ! git pull --rebase; then
            git rebase --abort || true
            echo "Data changed while collecting; skipping this update"
            exit 0
          fi
          git push || { echo "Push raced with another writer; skipping this update"; exit 0; }
