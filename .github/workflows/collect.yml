name: Collect and process

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (off the hour; GitHub may delay scheduled runs)
  workflow_dispatch:

permissions:
  contents: write   # commit data/
  issues: write     # open verification issues
  models: read      # GitHub Models fallback

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Collect, extract, match
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL_FAST: ${{ vars.LLM_MODEL_FAST }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_LLM_ITEMS_PER_RUN: ${{ vars.MAX_LLM_ITEMS_PER_RUN }}
          EXTRACT_BATCH_SIZE: ${{ vars.EXTRACT_BATCH_SIZE }}
          LLM_MIN_ITEMS: ${{ vars.LLM_MIN_ITEMS }}
        run: python -m tracker.run_pipeline
      - name: Commit data
        if: ${{ !cancelled() }}
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: update $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
