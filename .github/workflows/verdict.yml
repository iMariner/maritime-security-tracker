name: Apply verdict

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  apply:
    # Only verification issues, only comments that start with /verdict. The script sweeps all open
    # verification issues (several verdicts at once cancel each other's queued runs) and checks who wrote each.
    if: contains(github.event.issue.labels.*.name, 'verify') && startsWith(github.event.comment.body, '/verdict')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIERS: ${{ vars.VERIFIERS }}
        run: python -m tracker.apply_verdict
      - run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "verdict: issue #${{ github.event.issue.number }}"
          git pull --rebase
          git push
