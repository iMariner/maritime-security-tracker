name: Publish brief (fallback)

# Publishes a day's draft on WordPress without n8n: the owner asks Hermes on Telegram, Hermes comments
# "/publish YYYY-MM-DD" on the pinned "Daily brief trigger" issue. Only the owner account is accepted.
on:
  issue_comment:
    types: [created]

permissions:
  contents: write

jobs:
  publish:
    concurrency:
      group: data-writer
      cancel-in-progress: false
    if: contains(github.event.issue.labels.*.name, 'brief-trigger') && startsWith(github.event.comment.body, '/publish') && github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Publish
        env:
          BODY: ${{ github.event.comment.body }}
          WP_URL: ${{ vars.WP_URL || 'https://imariners.com' }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: |
          day=$(printf '%s' "$BODY" | head -1 | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' || true)
          [ -n "$day" ] || { echo "No date in the /publish comment"; exit 1; }
          python -m tracker.brief --publish-now "$day"
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "brief: published via GitHub fallback"
          git pull --rebase -X theirs
          git push
