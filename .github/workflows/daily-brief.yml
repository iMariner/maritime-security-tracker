name: Daily brief

on:
  schedule:
    - cron: "40 5 * * *"   # aims for about 06:00 UTC once GitHub's queue delay is added
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only (no WordPress, no social)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build and publish
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL_FAST: ${{ vars.LLM_MODEL_FAST }}
          LLM_MODEL_BRIEF: ${{ vars.LLM_MODEL_BRIEF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WP_URL: ${{ vars.WP_URL || 'https://imariners.com' }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_SLUG: ${{ vars.WP_CATEGORY_SLUG || 'maritime-security' }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'draft' }}
          PUBLISH_EMPTY_DAYS: ${{ vars.PUBLISH_EMPTY_DAYS || 'true' }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
        run: python -m tracker.brief ${{ inputs.preview && '--preview' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: brief
          path: out/
      - name: Commit data
        if: ${{ !inputs.preview }}
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "brief: $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
