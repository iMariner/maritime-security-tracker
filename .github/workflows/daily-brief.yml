name: Daily brief

on:
  schedule:
    # Backups only. Hermes normally starts the brief at about 04:35 UTC and checks it at 05:00; the
    # approval message goes out after that check. If either step fails, the first of these that GitHub
    # actually runs builds the brief or sends the waiting one, with a warning that the check did not run.
    - cron: "10 6 * * *"
    - cron: "40 6 * * *"
    - cron: "25 7 * * *"
    - cron: "55 7 * * *"
  workflow_dispatch:
    inputs:
      preview:
        description: "Preview only (no WordPress, no social)"
        type: boolean
        default: false
      notify:
        description: "Send the Telegram approval message"
        type: boolean
        default: true
      only_if_missing:
        description: "Do nothing if today's brief already exists (used by the Hermes trigger)"
        type: boolean
        default: false
      hold:
        description: "Build the draft but wait for Hermes's editor check before sending it for approval"
        type: boolean
        default: false
      send:
        description: "Only send today's draft for approval (after the final read); no rebuild"
        type: boolean
        default: false
      reviewed:
        description: "Rebuild after the editor check (no new collection), then send for approval"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write     # the fresh collection may open verification issues
  actions: write   # start the Pages deploy for the draft preview
  models: read

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Decide what this run does
        id: guard
        # skip=true: nothing to do. notify_only=true: today's draft exists but was never sent (the editor
        # check or the rebuild after it failed), so only send it, with a warning.
        run: |
          f="data/briefs/$(date -u +%Y-%m-%d).json"
          if [ "${{ inputs.send }}" = "true" ]; then
            echo "Sending today's draft as it is."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "notify_only=true" >> "$GITHUB_OUTPUT"
            echo "force=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -f "$f" ] && { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.only_if_missing }}" = "true" ]; }; then
            if [ "${{ github.event_name }}" = "schedule" ] && ! grep -q '"notified"' "$f"; then
              echo "Today's brief exists but was not sent; sending it now."
              echo "notify_only=true" >> "$GITHUB_OUTPUT"
            else
              echo "Today's brief already exists ($f); nothing to do."
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true' || steps.guard.outputs.notify_only == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.guard.outputs.skip != 'true' || steps.guard.outputs.notify_only == 'true'
      - name: Apply pending verdicts
        # the scheduled collection can lag by hours, so the brief collects fresh data itself
        if: steps.guard.outputs.skip != 'true' && !inputs.preview && !inputs.reviewed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIERS: ${{ vars.VERIFIERS }}
        run: python -m tracker.apply_verdict
      - name: Collect, extract, match
        if: steps.guard.outputs.skip != 'true' && !inputs.preview && !inputs.reviewed
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL_FAST: ${{ vars.LLM_MODEL_FAST }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX_LLM_ITEMS_PER_RUN: ${{ vars.MAX_LLM_ITEMS_PER_RUN }}
          EXTRACT_BATCH_SIZE: ${{ vars.EXTRACT_BATCH_SIZE }}
          LLM_MIN_ITEMS: ${{ vars.LLM_MIN_ITEMS }}
        run: python -m tracker.run_pipeline
      - name: Build and publish
        if: steps.guard.outputs.skip != 'true'
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL_FAST: ${{ vars.LLM_MODEL_FAST }}
          LLM_MODEL_BRIEF: ${{ vars.LLM_MODEL_BRIEF }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WP_URL: ${{ vars.WP_URL || 'https://imariners.com' }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          WP_CATEGORY_SLUG: ${{ vars.WP_CATEGORY_SLUG || 'maritime-security' }}
          WP_CATEGORY_ID: ${{ vars.WP_CATEGORY_ID }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'draft' }}
          PUBLISH_EMPTY_DAYS: ${{ vars.PUBLISH_EMPTY_DAYS || 'true' }}
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          NOTIFY_LATER: "1"
        run: python -m tracker.brief ${{ inputs.preview && '--preview' || '' }} ${{ inputs.reviewed && '--reviewed' || '' }}
      - uses: actions/upload-artifact@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          name: brief
          path: out/
      - name: Commit data
        if: steps.guard.outputs.skip != 'true' && !inputs.preview
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "brief: $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs   # on a race with collection, this brief's data wins
          git push
      - name: Put the draft preview online
        if: steps.guard.outputs.skip != 'true' && !inputs.preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run pages.yml -R "$GITHUB_REPOSITORY"
          url=$(python3 -c "import json,datetime;d=datetime.datetime.utcnow().date().isoformat();print(json.load(open(f'data/briefs/{d}.json')).get('preview_url',''))" 2>/dev/null || true)
          [ -z "$url" ] && exit 0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url?v=$i")
            [ "$code" = "200" ] && echo "Preview online: $url" && exit 0
            sleep 10
          done
          echo "Preview not online after 5 minutes; sending the approval message anyway"
      - name: Send to n8n for approval
        # held drafts wait for the editor check; the rebuild after it (reviewed) sends them
        if: (steps.guard.outputs.skip != 'true' || steps.guard.outputs.notify_only == 'true') && !inputs.preview && inputs.notify != false && !inputs.hold
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}
          N8N_WEBHOOK_TOKEN: ${{ secrets.N8N_WEBHOOK_TOKEN }}
          WP_URL: ${{ vars.WP_URL || 'https://imariners.com' }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}   # only to read the account balance for the message
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LOW_BALANCE_USD: ${{ vars.LOW_BALANCE_USD || '3' }}
        run: |
          python -m tracker.brief ${{ (steps.guard.outputs.notify_only == 'true' && steps.guard.outputs.force != 'true') && '--notify-if-pending' || '--notify' }}
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "brief: sent for approval $(date -u +%Y-%m-%d)"
          git pull --rebase -X theirs   # on a race with collection, this brief's data wins
          git push
