name: Refresh brief map

# Redraws the map of one brief already on WordPress and swaps it into the post. Text and status stay as they are.
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Brief date (YYYY-MM-DD)"
        required: true

permissions:
  contents: write

concurrency:
  group: data-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          WP_URL: ${{ vars.WP_URL || 'https://imariners.com' }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        run: python -m tracker.brief --refresh-image "${{ inputs.date }}"
      - name: Commit data
        run: |
          git config user.name "tracker-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "brief: new map for ${{ inputs.date }}"
          git pull --rebase
          git push
